name: Lección P-M columnas (ManimGX + Kokoro)
on:
  workflow_dispatch:
  push:
    branches:
      - lesson/interaccion-pm-columnas
      - main
    paths:
      - interaction_pm/**
      - .github/workflows/interaction_pm.yml
permissions:
  contents: read
jobs:
  engineering:
    name: Geometría, compatibilidad y equilibrio
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q numpy scipy
      - run: |
          python -m py_compile interaction_pm/model.py interaction_pm/story.py interaction_pm/scene.py interaction_pm/voice.py
          python -m unittest discover -v -s interaction_pm -p 'test_*.py'
          python -c "from interaction_pm.story import BEATS,TOTAL_SECONDS; print(len(BEATS),'capítulos,',TOTAL_SECONDS,'segundos')"
  video:
    needs: engineering
    runs-on: ubuntu-latest
    timeout-minutes: 150
    name: Render nativo en ManimGX
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libvulkan1 mesa-vulkan-drivers libegl1 libgl1 fonts-noto-core
          python -m pip install -q manimgx numpy scipy
      - name: Render ManimGX
        run: |
          mkdir -p build/interaction_pm
          manimgx render interaction_pm/scene.py 2>&1 | tee build/interaction_pm/manimgx.log
          python - <<'PY'
          import shutil
          from pathlib import Path
          vids=[p for p in Path('.').rglob('*.mp4') if 'build' not in p.parts]
          if not vids:raise SystemExit('No MP4 generated by manimgx')
          chosen=max(vids,key=lambda p:p.stat().st_mtime)
          shutil.copy2(chosen,'build/interaction_pm/silent.mp4')
          print('Source video',chosen)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manimgx-pm-silent
          path: build/interaction_pm/
  voice:
    needs: engineering
    runs-on: ubuntu-latest
    timeout-minutes: 70
    name: Kokoro em_alex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg libsndfile1
          python -m pip install -q "kokoro>=0.9.4" numpy soundfile
      - run: python interaction_pm/voice.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kokoro-pm-narration
          path: build/interaction_pm/narracion.wav
  export:
    needs: [video, voice]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    name: MP4 narrado y auditoría
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: manimgx-pm-silent
          path: build/interaction_pm
      - uses: actions/download-artifact@v4
        with:
          name: kokoro-pm-narration
          path: build/interaction_pm
      - name: Unificar material
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path("build/interaction_pm")
          for name in ('silent.mp4','narracion.wav'):
              paths=list(root.rglob(name))
              if not paths:raise SystemExit(f'Missing {name}')
              if paths[0] != root/name:shutil.copy2(paths[0],root/name)
          PY
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 build/interaction_pm/narracion.wav)
          ffmpeg -hide_banner -loglevel error -y -i build/interaction_pm/silent.mp4 -i build/interaction_pm/narracion.wav -filter_complex "[0:v]tpad=stop_mode=clone:stop_duration=25,format=yuv420p[v]" -map "[v]" -map 1:a:0 -c:v libx264 -preset ultrafast -crf 20 -fps_mode:v vfr -c:a aac -b:a 192k -t "$dur" -movflags +faststart build/interaction_pm/interaccion_PM_narrada.mp4
      - name: QA audiovisual
        run: |
          python -m pip install -q numpy scipy pillow
          python -m unittest discover -s interaction_pm -p 'test_*.py'
          expected=$(python -c "from interaction_pm.story import TOTAL_SECONDS; print(TOTAL_SECONDS)")
          python qa/video_audit.py build/interaction_pm/interaccion_PM_narrada.mp4 --out build/interaction_pm/qa --expected "$expected"
      - uses: actions/upload-artifact@v4
        with:
          name: leccion-PM-ManimGX-Kokoro-FINAL
          path: |
            build/interaction_pm/interaccion_PM_narrada.mp4
            build/interaction_pm/qa/*.jpg
            build/interaction_pm/qa/qa_report.json
          if-no-files-found: error
