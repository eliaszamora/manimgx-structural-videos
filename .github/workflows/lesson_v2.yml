name: Lección V2 ManimGX + Alex natural (gratis)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lesson_v2/**"
      - ".github/workflows/lesson_v2.yml"
permissions:
  contents: read
jobs:
  engineering_gate:
    name: Bloquear render si falla equilibrio o anaStruct
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencia FEM independiente
        run: python -m pip install "anastruct>=1.5,<2"
      - name: Validación analítica + FEM antes de render
        run: |
          python -m py_compile lesson_v2/story.py lesson_v2/scene.py lesson_v2/voice.py qa/anastruct_crosscheck.py
          python -m unittest discover -v -s qa -p 'test_*.py'
          python -m qa.anastruct_crosscheck
  video:
    needs: [engineering_gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Animación ManimGX lavapipe CPU
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar software libre para gráficos
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libvulkan1 mesa-vulkan-drivers libegl1 libgl1
          python -m pip install -q manimgx
      - name: Verificar narración y código
        run: |
          python -m py_compile lesson_v2/story.py lesson_v2/scene.py lesson_v2/voice.py
          python -c 'from lesson_v2.story import BEATS,TOTAL_SECONDS; print("Capítulos",len(BEATS),"Segundos",TOTAL_SECONDS)'
      - name: Renderizar clase genuina en ManimGX
        run: |
          set -o pipefail
          manimgx render lesson_v2/scene.py 2>&1 | tee manimgx_v2.log
          mkdir -p build
          python - <<'PY'
          from pathlib import Path
          import shutil
          vids=[p for p in Path('.').rglob("*.mp4") if "build" not in p.parts]
          if not vids: raise SystemExit("No se generó video")
          p=max(vids,key=lambda x:x.stat().st_mtime)
          print("Encontrado",p)
          shutil.copy2(p,"build/video.mp4")
          PY
          ffprobe -v error -show_entries format=duration,width,height -of default=noprint_wrappers=1 build/video.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manimgx-lesson-v2
          path: |
            build/video.mp4
            manimgx_v2.log
          if-no-files-found: warn
  speech:
    needs: [engineering_gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Narrador masculino Kokoro em_alex (CPU)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalación voz libre
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg libsndfile1
          python -m pip install -q "kokoro>=0.9.4" soundfile
      - name: Narrar capítulos y ajustar ritmo sin cortes
        run: |
          set -o pipefail
          python lesson_v2/voice.py 2>&1 | tee kokoro_v2.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kokoro-masculino-v2
          path: |
            build/narracion.wav
            build/report_voz.json
            kokoro_v2.log
          if-no-files-found: warn
  export:
    name: Empaquetar MP4 con audio en fase
    needs: [video, speech]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: manimgx-lesson-v2
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: kokoro-masculino-v2
          path: build
      - name: Probar duraciones y exportar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          find build -maxdepth 4 -type f -print
          test ! -f build/build/video.mp4 || mv build/build/video.mp4 build/video.mp4
          test ! -f build/build/narracion.wav || mv build/build/narracion.wav build/narracion.wav
          test ! -f build/build/report_voz.json || mv build/build/report_voz.json build/report_voz.json
          ls -lh build/
          test -s build/video.mp4 && test -s build/narracion.wav
          vdur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 build/video.mp4)
          adur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 build/narracion.wav)
          python -c "a=float('$adur');v=float('$vdur');print('Video',v,'Voz',a);assert abs(v-a) < 1.5, 'Desajuste entre capítulos y audio'"
          # ManimGX optimiza los tramos estáticos sin codificar cada fotograma.
          # -shortest cortaba ~12 s del audio por el último PTS real del stream visual.
          # Rellenamos esos últimos segundos con el fotograma final y verificamos ambos streams.
          ffmpeg -hide_banner -loglevel error -y -i build/video.mp4 -i build/narracion.wav -filter_complex "[0:v]tpad=stop_mode=clone:stop_duration=20,format=yuv420p[v]" -map "[v]" -map 1:a:0 -c:v libx264 -preset ultrafast -crf 19 -fps_mode:v vfr -c:a aac -b:a 192k -ar 48000 -t "$adur" -movflags +faststart build/leccion_v2_alex_natural.mp4
          vd=$(ffprobe -v error -select_streams v:0 -show_entries stream=duration -of csv=p=0 build/leccion_v2_alex_natural.mp4)
          ad=$(ffprobe -v error -select_streams a:0 -show_entries stream=duration -of csv=p=0 build/leccion_v2_alex_natural.mp4)
          python -c "v=float('$vd');a=float('$ad');print('Salida final video=',v,'audio=',a);assert abs(v-a)<0.4, 'Video y voz tienen diferente duración'"
          ffprobe -v error -show_entries format=duration -of csv=p=0 build/leccion_v2_alex_natural.mp4
      - name: Auditoría mecánica, visual y de duración final
        run: |
          python -m pip install -q pillow
          python -m unittest discover -s qa -p 'test_*.py'
          python qa/video_audit.py build/leccion_v2_alex_natural.mp4 --out build/video_qa --expected 169
      - uses: actions/upload-artifact@v4
        with:
          name: leccion-v2-alex-natural-FINAL
          path: |
            build/leccion_v2_alex_natural.mp4
            build/report_voz.json
            build/video_qa/*.jpg
            build/video_qa/qa_report.json
          if-no-files-found: error
