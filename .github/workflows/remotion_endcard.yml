name: Optional Remotion branded end card (individual license)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remotion_endcard.yml'
      - 'studio_v3/remotion/**'
permissions:
  contents: read
jobs:
  endcard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install optional Remotion (separate from engineering/render)
        run: |
          cd studio_v3/remotion
          npm install --no-audit --no-fund
          npx remotion browser ensure
      - name: Render 6-second end card
        run: |
          cd studio_v3/remotion
          npm run render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remotion-6s-endcard
          path: studio_v3/remotion/build/endcard.mp4
          if-no-files-found: warn
